<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>بوابة الدرجات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: chalkboard sidebar (desktop) or bottom bar (phone) around cards on graph paper. Every subject owns a colour. */
:root{
  --paper:#F3F7F4; --grid:#E1EAE4; --card:#FFFFFF; --ink:#12231B; --muted:#53695E; --line:#D6E2DA;
  --board:#183A2E; --board2:#235143; --chalk:#EAF3EC; --chalk-dim:#A9C3B3;
  --pencil:#FFC83D; --pencil-ink:#3A2B00; --btn:#183A2E; --btn-ink:#EAF3EC; --hl:#FFE08A; --focus:#2F6BEB;
  --s1:#2F6BEB; --s2:#12915A; --s3:#E0572E; --s4:#8A4FE0; --s5:#C98A00;
  --ex:#137A44; --ex-soft:#DDF2E5; --gd:#1D58B8; --gd-soft:#E0EBFA;
  --pa:#8F5A00; --pa-soft:#FAEBC6; --lo:#B3342C; --lo-soft:#F9DDDA;
  --shadow:0 1px 0 rgba(18,35,27,.04),0 8px 24px rgba(18,35,27,.07);
  --f-display:"Baloo Bhaijaan 2","Tajawal",Tahoma,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1612; --grid:#13221B; --card:#13211B; --ink:#E8F1EB; --muted:#93AAA0; --line:#25382F;
    --board:#0F2A20; --board2:#1B3F32; --chalk:#EAF3EC; --chalk-dim:#9DBBAA;
    --pencil:#FFD25E; --pencil-ink:#2B2000; --btn:#FFD25E; --btn-ink:#2B2000; --hl:#5E4A00; --focus:#8DB0FF;
    --s1:#7AA2FF; --s2:#4FD39A; --s3:#FF8A63; --s4:#B48CFF; --s5:#F2BC57;
    --ex:#63D391; --ex-soft:#14301F; --gd:#86B3F2; --gd-soft:#172B49;
    --pa:#F2BC57; --pa-soft:#3A2B0D; --lo:#F28F88; --lo-soft:#3E1917;
    --shadow:0 0 0 1px rgba(255,255,255,.03);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1612; --grid:#13221B; --card:#13211B; --ink:#E8F1EB; --muted:#93AAA0; --line:#25382F;
  --board:#0F2A20; --board2:#1B3F32; --chalk:#EAF3EC; --chalk-dim:#9DBBAA;
  --pencil:#FFD25E; --pencil-ink:#2B2000; --btn:#FFD25E; --btn-ink:#2B2000; --hl:#5E4A00; --focus:#8DB0FF;
  --s1:#7AA2FF; --s2:#4FD39A; --s3:#FF8A63; --s4:#B48CFF; --s5:#F2BC57;
  --ex:#63D391; --ex-soft:#14301F; --gd:#86B3F2; --gd-soft:#172B49;
  --pa:#F2BC57; --pa-soft:#3A2B0D; --lo:#F28F88; --lo-soft:#3E1917;
  --shadow:0 0 0 1px rgba(255,255,255,.03);
  color-scheme:dark;
}

html{direction:rtl}
body{font-family:var(--f-body);font-size:16px;line-height:1.7;color:var(--ink);direction:rtl;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.app{max-width:1240px;margin-inline:auto;padding-inline:16px;padding-block:16px 32px}
.num{font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4.4vw,36px);line-height:1.3;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.4}
h3{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.4}
.hl{background:linear-gradient(transparent 62%,var(--hl) 62%);padding-inline:.12em}
.meta{color:var(--muted);margin-block-start:4px}
.eyebrow{font-size:14px;font-weight:700;color:var(--muted);margin-block-end:6px}
.ic{flex:none}

/* buttons + fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:12px;border:2px solid var(--btn);background:var(--btn);color:var(--btn-ink);font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn.sm{min-height:38px;padding:5px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.lnk{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 8px;border-radius:8px;font-weight:700;font-size:14px;color:var(--ink)}
.lnk:hover{background:var(--hl)}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 16px;font-weight:500}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-weight:700}
label{font-weight:500;font-size:15px}
input,select,textarea{width:100%;min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
input[aria-invalid="true"]{border-color:var(--lo)}
input.code{letter-spacing:.35em;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.msg{min-height:1.5em;font-size:14px;color:var(--lo)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}

/* shared pieces */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.empty{padding:26px 20px;color:var(--muted)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 10px}
.pill{display:inline-flex;align-items:center;white-space:nowrap;padding:1px 12px;border-radius:999px;font-size:13px;font-weight:700}
.pill:empty{display:none}
.st-ex.pill{color:var(--ex);background:var(--ex-soft)}
.st-gd.pill{color:var(--gd);background:var(--gd-soft)}
.st-pa.pill{color:var(--pa);background:var(--pa-soft)}
.st-lo.pill{color:var(--lo);background:var(--lo-soft)}
.bar{position:relative;height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.fill{display:block;height:100%;border-radius:5px;background:var(--sc,var(--ink))}
.fill.st-ex{background:var(--ex)}.fill.st-gd{background:var(--gd)}.fill.st-pa{background:var(--pa)}.fill.st-lo{background:var(--lo)}
.sd{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--sc);flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--sc) 16%,var(--card))}
.av{display:inline-grid;place-items:center;flex:none;width:var(--sz,40px);height:var(--sz,40px);border-radius:50%;background:var(--avbg);color:var(--card);font-family:var(--f-display);font-weight:800;font-size:calc(var(--sz,40px)*.48);line-height:1}
.mark{position:relative;flex:none;width:38px;height:38px;border-radius:11px;background:var(--pencil);color:var(--pencil-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}

/* auth */
.auth{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);margin-block-start:8px}
.board{position:relative;background:var(--board);color:var(--chalk);padding:40px 40px 0;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.bbrand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px}
.board h1{font-size:clamp(32px,5vw,48px);color:var(--chalk)}
.board .hl{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--pencil) 55%,transparent) 62%)}
.blead{color:var(--chalk-dim);max-width:44ch;font-size:17px}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.feat li{display:flex;gap:10px;align-items:center}
.feat svg{color:var(--pencil)}
.scrawl{position:absolute;inset-block-start:22px;inset-inline-end:26px;font-family:var(--f-display);font-weight:800;font-size:46px;opacity:.1;transform:rotate(-7deg);pointer-events:none;white-space:nowrap}
.ruler{position:relative;height:30px;margin-block-start:auto;margin-inline:-40px}
.ruler::before,.ruler::after{content:"";position:absolute;inset-inline:0;inset-block-end:0;background-repeat:repeat-x}
.ruler::before{height:12px;background-image:linear-gradient(to left,color-mix(in srgb,var(--chalk) 45%,transparent) 2px,transparent 2px);background-size:12px 100%}
.ruler::after{height:22px;background-image:linear-gradient(to left,var(--pencil) 2px,transparent 2px);background-size:60px 100%}
.formside{background:var(--card);padding:36px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.ftop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.formside h2{font-size:28px;font-weight:800}
.login{display:flex;flex-direction:column;gap:12px}
.mail{border:2px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.mail b{font-size:22px;color:var(--ink);letter-spacing:.15em;font-variant-numeric:tabular-nums}
.try{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:16px;background:var(--board);color:var(--chalk);border-radius:22px;padding:20px 14px 16px;display:flex;flex-direction:column;gap:18px}
.sbrand{display:flex;align-items:center;gap:10px;padding-inline:6px}
.sbrand b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.2}
.sbrand small{color:var(--chalk-dim);font-size:13px}
.snav{display:grid;gap:2px}
.nv{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border:0;border-radius:12px;background:none;color:var(--chalk-dim);font-weight:500;text-align:start}
.nv:hover{background:color-mix(in srgb,var(--chalk) 9%,transparent);color:var(--chalk)}
.nv[aria-current="page"]{background:var(--board2);color:var(--chalk);font-weight:700}
.nv[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:0;inset-block:9px;width:4px;border-radius:2px;background:var(--pencil)}
.nv .badge{margin-inline-start:auto}
.sfoot{display:grid;gap:8px;border-block-start:1px solid color-mix(in srgb,var(--chalk) 16%,transparent);padding-block-start:14px}
.sfoot .em{font-size:13px;color:var(--chalk-dim);direction:ltr;overflow-wrap:anywhere;padding-inline:6px}
.sbtn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--chalk) 20%,transparent);background:none;color:var(--chalk);font-size:15px}
.sbtn:hover{background:color-mix(in srgb,var(--chalk) 9%,transparent)}
.badge{min-width:20px;height:20px;padding-inline:6px;border-radius:999px;background:var(--pencil);color:var(--pencil-ink);font-size:12px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.main{min-width:0}
.topbar{display:none}
.bottom{display:none}
.page{display:grid;gap:16px;align-content:start}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.kidbar{display:flex;gap:8px;flex-wrap:wrap}
.kid{display:inline-flex;align-items:center;gap:8px;padding:5px 16px 5px 8px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700}
.kid small{font-weight:400;color:var(--muted)}
.kid[aria-pressed="true"]{border-color:var(--ink)}

/* home */
.heroc{overflow:hidden}
.herotop{display:flex;align-items:center;gap:16px;padding:20px 22px;flex-wrap:wrap}
.herotop h2{font-size:24px}
.ledger{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block-start:1px solid var(--line)}
.lg{padding:16px 22px;border-inline-start:1px solid var(--line);display:grid;gap:2px}
.lg:first-child{border-inline-start:0}
.lg span{font-size:14px;color:var(--muted)}
.lg b{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.lr{display:flex;align-items:center;gap:12px;padding:10px 18px;border-block-start:1px solid var(--line)}
.lr small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.lr b{font-weight:700}
.lr .sc2{white-space:nowrap}
.per{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 18px;border-block-start:1px solid var(--line)}
.pn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:color-mix(in srgb,var(--sc,var(--muted)) 18%,var(--card))}
.per small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.per time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.per.brk{background:color-mix(in srgb,var(--pencil) 14%,var(--card));font-weight:700}

/* grades */
.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;padding:22px;align-items:center}
.ringbox{display:grid;justify-items:center;gap:8px}
.ring{width:150px;height:150px}
.rt{fill:none;stroke:var(--line);stroke-width:12}
.rf{fill:none;stroke-width:12;stroke-linecap:round}
.rf.st-ex{stroke:var(--ex)}.rf.st-gd{stroke:var(--gd)}.rf.st-pa{stroke:var(--pa)}.rf.st-lo{stroke:var(--lo)}
.rn{font-family:var(--f-display);font-weight:800;font-size:30px;fill:var(--ink)}
.facts{display:grid;gap:10px}
.fact{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border-block-end:1px solid var(--line);padding-block-end:10px}
.fact:last-child{border:0;padding:0}
.fact>span:first-child{color:var(--muted)}
.cmp{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 92px;gap:14px;align-items:center;padding:12px 18px;border-block-start:1px solid var(--line)}
.bars{display:grid;gap:6px}
.bl{display:grid;grid-template-columns:34px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bl .bar{height:8px}
.bl.prev .fill{background:color-mix(in srgb,var(--muted) 50%,transparent)}
.report{overflow:hidden}
.rhead,.rrow{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(var(--cols),minmax(0,.7fr)) minmax(0,1.3fr);gap:14px;align-items:center;padding:14px 20px}
.rhead{font-size:13px;color:var(--muted);font-weight:700;border-block-end:1px solid var(--line)}
.rrow{border-block-start:1px solid var(--line)}
.rsub{min-width:0}
.rsub strong{font-family:var(--f-display);font-weight:700;display:flex;align-items:center;gap:8px}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin-block-start:2px}
.cell{font-variant-numeric:tabular-nums;font-weight:700}
.cell small{color:var(--muted);font-weight:400}
.cell.none{color:var(--muted);font-weight:400}
.ravg{display:grid;gap:6px;min-width:0}
.ravg .line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ravg b{font-variant-numeric:tabular-nums;font-size:18px}
.legend{font-size:13px;color:var(--muted)}

/* attendance */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stats .lg b.st-ex{color:var(--ex)}.stats .lg b.st-lo{color:var(--lo)}.stats .lg b.st-pa{color:var(--pa)}.stats .lg b.st-gd{color:var(--gd)}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-block-end:1px solid var(--line)}
.mnav h2{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:14px 16px 18px}
.cw{font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.cw .f{display:inline}.cw .s{display:none}
.dy{min-height:68px;border-radius:10px;border:1px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:2px;font-size:13px;background:var(--card)}
.dy .n{font-variant-numeric:tabular-nums;font-weight:700}
.dy .t{font-size:12px;font-weight:700}
.dy.blank{border:0;background:none}
.dy.off{border-style:dashed;color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 70%,transparent) 6px 8px)}
.dy.today{outline:3px solid var(--pencil);outline-offset:1px}
.dy.s-present{background:var(--ex-soft)}.dy.s-present .t{color:var(--ex)}
.dy.s-absent{background:var(--lo-soft)}.dy.s-absent .t{color:var(--lo)}
.dy.s-late{background:var(--pa-soft)}.dy.s-late .t{color:var(--pa)}
.dy.s-excused{background:var(--gd-soft)}.dy.s-excused .t{color:var(--gd)}

/* homework */
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{padding:7px 14px;background:none;border:0;border-inline-start:1px solid var(--line);font-size:15px}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);font-weight:700}
.hwl{display:grid;gap:12px}
.hw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:16px 18px;align-items:center}
.hw.done h3{text-decoration:line-through;color:var(--muted)}
.hw p{color:var(--muted);font-size:15px}
.hw .meta2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.check{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:transparent}
.check:hover{border-color:var(--ex)}
.check[aria-pressed="true"]{background:var(--ex);border-color:var(--ex);color:var(--card)}

/* schedule */
.daybar{display:flex;gap:8px;flex-wrap:wrap}
.wkwrap{overflow-x:auto;padding:8px 12px 14px}
.wk{width:100%;min-width:640px;border-collapse:separate;border-spacing:6px}
.wk th{font-size:13px;color:var(--muted);font-weight:700;padding:4px}
.wk th.td{color:var(--ink)}
.wk td{border-radius:10px;padding:8px 6px;text-align:center;font-size:14px;font-weight:500;background:color-mix(in srgb,var(--sc) 15%,var(--card))}
.wk td.td{outline:2px solid var(--pencil)}
.wk td.pc{background:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.wk tr.brkr td{background:color-mix(in srgb,var(--pencil) 16%,var(--card));font-weight:700;font-size:13px}

/* news */
.nw{display:grid;gap:6px;padding:16px 18px}
.nw .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nw p{color:var(--muted);font-size:15px}
.nw .by{font-size:13px}
.newsl{display:grid;gap:12px}
.sec{margin-block-start:6px}
.formcard{padding:18px;display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .wide{grid-column:1/-1}
.del{font-size:13px;padding:3px 10px;border-radius:8px;border:1.5px solid var(--line);background:none;color:var(--muted)}
.del.sure{border-color:var(--lo);color:var(--lo);font-weight:700}

/* teacher */
.tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,.6fr);gap:14px;padding:18px}
.tools .hint{grid-column:1/-1}
.sheet{overflow:hidden}

const pct=(s,m)=>m?Math.round(s/m*100):0;
const state=p=>p>=85?['ex','ممتاز']:p>=65?['gd','جيد']:p>=50?['pa','مقبول']:['lo','محتاج متابعة'];

function ring(p,k){

}

function classList(){const l=[];db.students.forEach(s=>{if(l.indexOf(s.cls)<0)l.push(s.cls)});if(l.indexOf(ui.tClass)<0)ui.tClass=l[0];return l}

function childReport(sid){
  const gs=db.grades.filter(g=>g.sid===sid).sort((a,b)=>a.date.localeCompare(b.date));
  const exams=[];
  gs.forEach(g=>{if(exams.indexOf(g.exam)<0)exams.push(g.exam)});
  const rows=[];
  SUBJECTS.forEach(sub=>{
    const mine=gs.filter(g=>g.sub===sub);
    if(!mine.length)return;
    let sum=0,max=0;mine.forEach(g=>{sum+=g.score;max+=g.max});
    const withNote=mine.filter(g=>g.note).sort((a,b)=>b.date.localeCompare(a.date))[0];
    const ps=mine.map(g=>pct(g.score,g.max));
    rows.push({sub,p:pct(sum,max),note:withNote,cells:exams.map(e=>mine.filter(g=>g.exam===e)[0]||null),
      last:ps[ps.length-1],prev:ps.length>1?ps[ps.length-2]:null});
  });
  const avg=rows.length?Math.round(rows.reduce((a,r)=>a+r.p,0)/rows.length):0;
  let last='';
  gs.forEach(g=>{const d=g.posted||g.date;if(d>last)last=d});
  return {exams,rows,avg,last};
}
function attStats(sid,from,to){
  const c={present:0,absent:0,late:0,excused:0};
  Object.keys(db.att).forEach(k=>{
    if(k.indexOf(sid+'|')!==0)return;
    const d=k.slice(sid.length+1);
    if(d>=from&&d<=to)c[db.att[k]]++;
  });
  const tot=c.present+c.absent+c.late+c.excused;
  return {c,tot,rate:tot?Math.round((c.present+c.late)/tot*100):100};
}
const teacherOf=sub=>{const t=db.teachers.filter(x=>x.subject===sub)[0];return t?t.name:'مدرس المادة'};
function ttFor(cls){const sh=cls==='الخامس أ'?0:cls.length%5;return BASE.map(day=>day.map(x=>(x+sh)%5))}

  return out+`</section><p class="legend">ممتاز من 85%، جيد من 65%، مقبول من 50%، وأقل من كده محتاج متابعة.</p>`;

  `<section class="card"><div class="stats">${stat('نسبة الحضور',st.rate+'%',st.rate>=90?'ex':st.rate>=75?'pa':'lo')+stat('أيام الغياب',st.c.absent,st.c.absent?'lo':'')+stat('أيام التأخير',st.c.late,st.c.late?'pa':'')+stat('غياب بعذر',st.c.excused,st.c.excused?'gd':'')}</div></section>
   <section class="card"><div class="mnav"><button class="btn ghost sm" type="button" data-act="month" data-d="-1"${ui.month<=-3?' disabled':''}>${ic('arrR',16)}الشهر اللي فات</button><h2>${label}</h2><button class="btn ghost sm" type="button" data-act="month" data-d="1"${ui.month>=0?' disabled':''}>الشهر الجاي${ic('arr',16)}</button></div>

   <p class="legend">الأيام المخططة هي الجمعة والسبت (إجازة). الدراسة من الأحد للخميس.</p>`+

  const rows=tt[sel].map((s,i)=>{
    const sub=SUBJECTS[s];

      `<div class="per" style="${sty(sub)}"><span class="pn">${i+1}</span><div><b>${esc(sub)}</b><small>${esc(teacherOf(sub))}</small></div><time>${PERIODS[i][0]} - ${PERIODS[i][1]}</time></div>`;

const getPrefs=email=>{const p=db.prefs[email]||{};return {daily:p.daily!==false,time:p.time||'18:00'}};
function setPrefs(patch){
  const cur=getPrefs(ui.user.email);
  db.prefs[ui.user.email]={daily:('daily' in patch)?patch.daily:cur.daily,time:patch.time||cur.time};
  persist();render();
  toast(patch.daily===false?'اتوقف الإشعار اليومي.':patch.daily===true?'الإشعار اليومي اشتغل.':'ميعاد الإشعار اتغير.');
  const el=document.getElementById(('daily' in patch)?'daily':'dtime');if(el)el.focus();
}
function digestCard(email,day,p,hm){
  const kids=db.students.filter(s=>s.parentEmail===email);
  const upcoming=day===today()&&hm<p.time;
  const names=kids.map(first).join(' و');
  const body=kids.map(k=>{
    const parts=[];
    const fresh=db.grades.filter(g=>g.sid===k.id&&(g.posted||g.date)===day);
    if(fresh.length)parts.push('درجات جديدة: '+fresh.map(g=>`${esc(g.sub)} <span class="num">${num(g.score)}/${num(g.max)}</span>`).join('، '));
    const a=db.att[k.id+'|'+day];
    if(a&&a!=='present')parts.push(`<span class="pill st-${STATUS[a][1]}">${STATUS[a][0]} النهارده</span>`);
    const due=db.homework.filter(h=>h.cls===k.cls&&h.due===addDays(day,1));
    if(due.length)parts.push('واجب بكرة: '+due.map(h=>esc(h.title)).join('، '));
    if(!parts.length)parts.push(`مفيش جديد. المتوسط العام لسه <span class="num">${childReport(k.id).avg}%</span>`);
    return `<p><b>${esc(first(k))}:</b> ${parts.join(' · ')}</p>`;
  }).join('');
  const nm=db.msgs.filter(m=>m.parent===email&&m.from==='teacher'&&m.ts.slice(0,10)===day).length;
  const status=upcoming?`<span class="pill st-gd">هيتبعت ${fmtTime(p.time)}</span>`:`<span class="pill st-ex">اتبعت ${fmtTime(p.time)}</span>`;
  return `<article class="card digest"><header><div><strong>ملخص ${esc(names)} · ${fmtDay(day)}</strong><small>${SCHOOL} ← <span dir="ltr">${esc(email)}</span></small></div>${status}</header><div class="dbody">${body}${nm?`<p>وصلتك ${nm} رسالة جديدة من المدرسين.</p>`:''}</div></article>`;
}
function pNotifs(){
  const email=ui.user.email,p=getPrefs(email);

/* ---------- messages ---------- */
function parentList(){
  const map={},order=[];
  db.students.forEach(s=>{if(!map[s.parentEmail]){map[s.parentEmail]=[];order.push(s.parentEmail)}map[s.parentEmail].push(s)});
  return order.map(e=>({email:e,kids:map[e]}));
}
const unFor=(isParent,me,other)=>db.msgs.filter(m=>!m.read&&(isParent?(m.parent===me&&m.teacher===other&&m.from==='teacher'):(m.teacher===me&&m.parent===other&&m.from==='parent'))).length;
function pMsgs(){
  const me=ui.user,isParent=me.role==='parent';
  const cands=isParent?db.teachers.map(t=>({value:t.email,text:t.name+' · '+t.subject})):parentList().map(p=>({value:p.email,text:'ولي أمر '+p.kids.map(first).join(' و')}));
  if(!cands.some(o=>o.value===ui.thread)){
    const withNew=cands.filter(o=>unFor(isParent,me.email,o.value))[0];
    ui.thread=(withNew||cands[0]).value;
  }
  const parentEmail=isParent?me.email:ui.thread,teacherEmail=isParent?ui.thread:me.email;
  let changed=false;
  db.msgs.forEach(m=>{if(m.parent===parentEmail&&m.teacher===teacherEmail&&!m.read&&m.from===(isParent?'teacher':'parent')){m.read=true;changed=true}});
  if(changed)persist();
  const list=db.msgs.filter(m=>m.parent===parentEmail&&m.teacher===teacherEmail).sort((a,b)=>a.ts.localeCompare(b.ts));
  const kids=db.students.filter(s=>s.parentEmail===parentEmail);
  const opts=cands.map(o=>{const n=unFor(isParent,me.email,o.value);return `<option value="${esc(o.value)}"${o.value===ui.thread?' selected':''}>${esc(o.text)}${n?' (جديد)':''}</option>`}).join('');
  const bubbles=list.length?list.map(m=>{
    const mine=(m.from==='parent')===isParent;
    const k=m.sid?db.students.filter(s=>s.id===m.sid)[0]:null;
    return `<div class="bub ${mine?'mine':'theirs'}"><p>${esc(m.text)}</p><small>${k?'بخصوص '+esc(first(k))+' · ':''}${fmtStamp(m.ts)}</small></div>`;
  }).join(''):'<p class="muted">لسه مفيش رسائل. اكتب أول رسالة من تحت.</p>';
  const kidSel=isParent?`<div class="field"><label for="msg-kid">بخصوص</label><select id="msg-kid">${kids.map(k=>`<option value="${k.id}"${k.id===ui.child?' selected':''}>${esc(first(k))}</option>`).join('')}</select></div>`:'';
  return hd('الرسائل','',isParent?'اكتب للمدرس مباشرة، وهيوصله إشعار على إيميله.':'ردّ على أولياء الأمور أو ابدأ رسالة جديدة.')+
  `<div class="msgs"><div class="card tools2"><div class="field"><label for="thr">${isParent?'المدرس':'ولي الأمر'}</label><select id="thr">${opts}</select></div></div>
   <div class="card thread" id="thread" tabindex="0" aria-label="المحادثة">${bubbles}</div>
   <form class="card compose" data-form="msg" novalidate>${kidSel}<div class="field"><label for="msg-text">رسالتك</label><textarea id="msg-text" maxlength="500" rows="3"></textarea></div><div class="btnrow"><button class="btn" type="submit">إرسال</button></div></form></div>`;
}

/* ---------- teacher: home ---------- */
function tHome(){
  const t=ui.user.teacher,classes=classList();
  const studs=db.students.filter(s=>s.cls===ui.tClass);
  const per=studs.map(s=>{
    let sum=0,max=0;
    db.grades.filter(g=>g.sid===s.id&&g.sub===t.subject).forEach(g=>{sum+=g.score;max+=g.max});
    return {s,p:max?pct(sum,max):null,abs:attStats(s.id,addDays(today(),-30),today()).c.absent};
  });
  const withP=per.filter(x=>x.p!==null);
  const avg=withP.length?Math.round(withP.reduce((a,x)=>a+x.p,0)/withP.length):null;
  const counts={ex:0,gd:0,pa:0,lo:0};
  withP.forEach(x=>{counts[state(x.p)[0]]++});
  const ls=lastSchool(today());
  let here=0,tot=0;
  studs.forEach(s=>{const a=db.att[s.id+'|'+ls];if(a){tot++;if(a==='present'||a==='late')here++}});
  const names={ex:'ممتاز',gd:'جيد',pa:'مقبول',lo:'محتاج متابعة'};
  const dist=withP.length?`<div class="dist" role="img" aria-label="توزيع المستويات">${['ex','gd','pa','lo'].filter(k=>counts[k]).map(k=>`<span class="st-${k}" style="flex:${counts[k]}"></span>`).join('')}</div>
    <div class="dleg">${['ex','gd','pa','lo'].map(k=>`<span><span class="pill st-${k}">${names[k]}</span> <b class="num">${counts[k]}</b></span>`).join('')}</div>`:'<p class="empty">لسه مفيش درجات في '+esc(t.subject)+' للفصل ده.</p>';
  const watch=per.filter(x=>(x.p!==null&&x.p<65)||x.abs>=2);
  const watchHtml=watch.length?watch.map(x=>`<div class="lr">${av(x.s.name,36)}<div class="grow"><b>${esc(x.s.name)}</b><small>${x.p!==null?'متوسط '+esc(t.subject)+' '+x.p+'%':''}${x.p!==null&&x.abs>=2?' · ':''}${x.abs>=2?'غاب '+x.abs+' أيام آخر 30 يوم':''}</small></div><button class="btn ghost sm" type="button" data-act="talk" data-email="${esc(x.s.parentEmail)}">كلّم ولي الأمر</button></div>`).join(''):'<p class="empty">مفيش طلاب محتاجين متابعة دلوقتي.</p>';
  const mine=db.homework.filter(h=>h.sub===t.subject&&h.cls===ui.tClass&&h.due>=today()).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,3);
  const hwHtml=mine.length?mine.map(h=>{
    const done=studs.filter(s=>db.hwDone[h.id+'|'+s.id]).length,d=dueInfo(h.due);
    return `<div class="lr"><div class="grow"><b>${esc(h.title)}</b><small>${done} من ${studs.length} خلّصوا</small></div><span class="pill st-${d[1]}">${d[0]}</span></div>`;
  }).join(''):'<p class="empty">مفيش واجبات قادمة للفصل ده.</p>';
  const hr=new Date().getHours();
  return hd((hr<12?'صباح الخير':'مساء الخير'),esc(t.name),`مدرس ${esc(t.subject)} · ${fmtDay(today())}`)+
  `<div class="kidbar" role="group" aria-label="اختار الفصل">${classes.map(c=>`<button class="chip" type="button" data-act="cls" data-c="${esc(c)}" aria-pressed="${c===ui.tClass}">${esc(c)}</button>`).join('')}</div>
  <section class="card"><div class="ledger">
    <div class="lg"><span>عدد الطلاب</span><b>${studs.length}</b></div>
    <div class="lg"><span>متوسط الفصل في ${esc(t.subject)}</span><b>${avg!==null?avg+'%':'—'}</b></div>
    <div class="lg"><span>حضور ${DAYS[dow(ls)]}</span><b>${tot?here+'/'+tot:'—'}</b></div>
    <div class="lg"><span>رسائل جديدة</span><b>${unread()}</b></div></div></section>
  <div class="quick"><button class="btn" type="button" data-act="nav" data-page="grades">${ic('chart',18)}سجّل الدرجات</button><button class="btn ghost" type="button" data-act="nav" data-page="attendance">${ic('cal',18)}سجّل الحضور</button><button class="btn ghost" type="button" data-act="nav" data-page="homework">${ic('book',18)}واجب جديد</button></div>
  <div class="hgrid">${cardH('مستويات الفصل',null,dist)}${cardH('واجبات قادمة','homework',hwHtml)}</div>
  ${cardH('طلاب محتاجين متابعة',null,watchHtml)}`;
}

/* ---------- teacher: grades sheet ---------- */
function examNames(){
  const seen={},list=[];
  db.grades.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(g=>{if(!seen[g.exam]){seen[g.exam]=1;list.push(g.exam)}});
  return list;
}
function tGrades(){
  const t=ui.user.teacher,classes=classList(),exams=examNames();
  if(!ui.tExam)ui.tExam=exams.length?exams[exams.length-1]:'اختبار نوفمبر';
  return hd('تسجيل','الدرجات',`مادة ${esc(t.subject)}. اكتب الدرجات واضغط حفظ، وولي الأمر بيشوفها على طول.`)+
  `<section class="card tools">
    <div class="field"><label for="cls">الفصل</label><select id="cls">${classes.map(c=>`<option${c===ui.tClass?' selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="field"><label for="exam">الاختبار</label><input id="exam" list="exams" autocomplete="off" value="${esc(ui.tExam)}"><datalist id="exams">${exams.map(e=>`<option value="${esc(e)}"></option>`).join('')}</datalist></div>
    <div class="field"><label for="max">الدرجة الكاملة</label><input id="max" type="number" inputmode="decimal" min="1" step="0.5" value="20"></div>
    <p class="hint">لإضافة اختبار جديد اكتب اسمه في خانة الاختبار. لو غيّرت الفصل أو الاختبار، الدرجات اللي ما اتحفظتش بتتمسح.</p></section>
  <section class="card sheet" id="sheet"></section>
  <div class="savebar"><span id="count"></span><button class="btn" type="button" data-act="save">حفظ الدرجات</button></div>
  <details class="card add"><summary>إضافة طالب جديد</summary>
    <form class="addgrid" data-form="addstudent" novalidate>
      <div class="field"><label for="ns-name">اسم الطالب</label><input id="ns-name" autocomplete="off"></div>
      <div class="field"><label for="ns-cls">الفصل</label><input id="ns-cls" list="clslist" autocomplete="off" value="${esc(ui.tClass)}"><datalist id="clslist">${classes.map(c=>`<option value="${esc(c)}"></option>`).join('')}</datalist></div>
      <div class="field"><label for="ns-email">إيميل ولي الأمر</label><input id="ns-email" type="email" dir="ltr" autocomplete="off"></div>
      <button class="btn" type="submit">إضافة</button></form></details>`;
}
const findGrade=(sid,sub,exam)=>db.grades.filter(g=>g.sid===sid&&g.sub===sub&&g.exam===exam)[0];
function renderSheet(){
  const t=ui.user.teacher,sheet=document.getElementById('sheet');
  if(!sheet)return;
  const list=db.students.filter(s=>s.cls===ui.tClass);
  const maxEl=document.getElementById('max');
  const any=list.map(s=>findGrade(s.id,t.subject,ui.tExam)).filter(Boolean)[0];
  if(any)maxEl.value=any.max;
  if(!list.length){sheet.innerHTML='<p class="empty">مفيش طلاب في الفصل ده. ضيف طالب من الأسفل.</p>';updateCount();return}
  sheet.innerHTML=list.map(s=>{
    const g=findGrade(s.id,t.subject,ui.tExam);
    return `<div class="srow" data-sid="${s.id}">
      <div class="sname">${av(s.name,38)}<div style="min-width:0"><strong>${esc(s.name)}</strong><small>${esc(s.parentEmail)}</small></div></div>
      <div class="field sc"><label for="sc-${s.id}">الدرجة</label><input id="sc-${s.id}" type="number" inputmode="decimal" min="0" step="0.5" value="${g?esc(g.score):''}"></div>
      <div class="field nt"><label for="nt-${s.id}">ملاحظة (اختياري)</label><input id="nt-${s.id}" type="text" maxlength="120" value="${g?esc(g.note):''}"></div>
      <div class="pillbox"><span class="pill" data-pill></span></div></div>`;
  }).join('');
  refreshPills();
}
function refreshPills(){
  const max=parseFloat(document.getElementById('max').value)||20;
  const rows=app.querySelectorAll('.srow');let filled=0;
  rows.forEach(row=>{
    const input=row.querySelector('input[type=number]'),pill=row.querySelector('[data-pill]'),v=input.value.trim();
    pill.className='pill';pill.textContent='';
    if(v!==''){
      filled++;const n=parseFloat(v);
      if(!isNaN(n)&&n>=0&&n<=max){const s=state(pct(n,max));pill.className='pill st-'+s[0];pill.textContent=s[1]}
      else{pill.className='pill st-lo';pill.textContent='خارج الحد'}
    }
  });
  updateCount(filled,rows.length);
}
function updateCount(f,n){const c=document.getElementById('count');if(c)c.textContent=n?'اتكتب '+(f||0)+' من '+n+' طالب':''}
function saveGrades(){
  const t=ui.user.teacher,exam=ui.tExam.trim(),max=parseFloat(document.getElementById('max').value);
  if(!exam){toast('اكتب اسم الاختبار الأول.');document.getElementById('exam').focus();return}
  if(!(max>0)){toast('الدرجة الكاملة لازم تكون رقم أكبر من صفر.');document.getElementById('max').focus();return}
  let bad=null;const pending=[];
  app.querySelectorAll('.srow').forEach(row=>{
    const sid=row.getAttribute('data-sid'),inp=row.querySelector('input[type=number]'),note=row.querySelector('input[type=text]').value.trim();
    inp.removeAttribute('aria-invalid');
    const v=inp.value.trim();if(v==='')return;
    const n=parseFloat(v);
    if(isNaN(n)||n<0||n>max){inp.setAttribute('aria-invalid','true');if(!bad)bad=inp;return}
    pending.push({sid,score:n,note});
  });
  if(bad){toast('في درجة خارج الحد المسموح (من 0 لـ '+num(max)+'). راجع الخانات المعلّمة.');bad.focus();return}
  if(!pending.length){toast('مفيش درجات مكتوبة للحفظ.');return}
  const known=db.grades.filter(g=>g.exam===exam)[0],date=known?known.date:today();
  pending.forEach(p=>{
    const g=findGrade(p.sid,t.subject,exam);
    if(g){g.score=p.score;g.max=max;g.note=p.note;g.by=p.note?t.name:'';g.date=date;g.posted=today()}
    else db.grades.push({sid:p.sid,sub:t.subject,exam,date,posted:today(),score:p.score,max,note:p.note,by:p.note?t.name:''});
  });
  persist();ui.tExam=exam;
  toast('تم حفظ '+pending.length+' درجة. ولي الأمر هيوصله إشعار على إيميله (تجريبي).');
}

/* ---------- teacher: attendance ---------- */
function tAtt(){
  const classes=classList();
  if(!ui.tDate)ui.tDate=lastSchool(today());
  const date=ui.tDate,studs=db.students.filter(s=>s.cls===ui.tClass);
  const key=ui.tClass+'|'+date;
  if(ui.attKey!==key){ui.attKey=key;ui.attDraft={};studs.forEach(s=>{ui.attDraft[s.id]=db.att[s.id+'|'+date]||'present'})}
  const school=isSchool(date)&&date<=today();
  return hd('تسجيل','الحضور',`اضغط على حالة كل طالب واحفظ. أولياء الأمور بيوصلهم إشعار بالغياب.`)+
  `<section class="card tools" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <div class="field"><label for="cls">الفصل</label><select id="cls">${classes.map(c=>`<option${c===ui.tClass?' selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="field"><label for="tdate">التاريخ</label><input id="tdate" type="date" max="${today()}" value="${date}"></div>
    ${school?'':'<p class="hint" style="color:var(--lo)">اليوم ده إجازة (الجمعة والسبت) أو لسه ماجاش. اختار يوم دراسي من الأحد للخميس.</p>'}</section>
  <section class="card sheet" id="attrows">${attRows(studs)}</section>
  <div class="savebar"><span id="attcount">${attCount(studs)}</span><div class="btnrow"><button class="btn ghost" type="button" data-act="attall">الكل حاضر</button><button class="btn" type="button" data-act="attsave"${school?'':' disabled'}>حفظ الحضور</button></div></div>`;
}
function attRows(studs){
  if(!studs.length)return '<p class="empty">مفيش طلاب في الفصل ده.</p>';
  return studs.map(s=>`<div class="arow"><div class="sname">${av(s.name,38)}<strong>${esc(s.name)}</strong></div>
    <div class="seg att" role="group" aria-label="حضور ${esc(s.name)}">${Object.keys(STATUS).map(k=>`<button type="button" data-act="att" data-sid="${s.id}" data-st="${k}" aria-pressed="${ui.attDraft[s.id]===k}">${STATUS[k][0]}</button>`).join('')}</div></div>`).join('');
}
function attCount(studs){
  const c={present:0,absent:0,late:0,excused:0};
  studs.forEach(s=>{c[ui.attDraft[s.id]||'present']++});
  return `حاضر ${c.present} · غايب ${c.absent} · متأخر ${c.late} · بعذر ${c.excused}`;
}
function saveAtt(){
  const studs=db.students.filter(s=>s.cls===ui.tClass);
  studs.forEach(s=>{db.att[s.id+'|'+ui.tDate]=ui.attDraft[s.id]||'present'});
  persist();
  const ab=studs.filter(s=>ui.attDraft[s.id]==='absent').length;
  toast('تم حفظ حضور '+ui.tClass+' يوم '+fmtDay(ui.tDate)+(ab?'. هيوصل إشعار لـ'+ab+' من أولياء الأمور (تجريبي).':'.'));
}

/* ---------- teacher: homework ---------- */
function tHw(){
  const t=ui.user.teacher,classes=classList();
  const mine=db.homework.filter(h=>h.sub===t.subject).sort((a,b)=>b.due.localeCompare(a.due));
  const form=`<form class="card formcard" data-form="hw" novalidate><h2>واجب جديد في ${esc(t.subject)}</h2><div class="fgrid">
    <div class="field"><label for="hw-cls">الفصل</label><select id="hw-cls">${classes.map(c=>`<option${c===ui.tClass?' selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="field"><label for="hw-due">ميعاد التسليم</label><input id="hw-due" type="date" value="${nextSchool(addDays(today(),1))}"></div>
    <div class="field wide"><label for="hw-title">عنوان الواجب</label><input id="hw-title" maxlength="80" autocomplete="off"></div>
    <div class="field wide"><label for="hw-desc">التفاصيل</label><textarea id="hw-desc" maxlength="240" rows="2"></textarea></div></div>
    <div class="btnrow"><button class="btn" type="submit">${ic('plus',18)}إضافة الواجب</button></div></form>`;
  const list=mine.length?`<div class="hwl">${mine.map(h=>{
    const studs=db.students.filter(s=>s.cls===h.cls),done=studs.filter(s=>db.hwDone[h.id+'|'+s.id]).length,d=dueInfo(h.due);
    const sure=ui.confirmDel==='hw|'+h.id;
    return `<article class="card hw" style="${sty(h.sub)}"><div><div class="meta2"><span class="tag">${esc(h.cls)}</span><span class="pill st-${d[1]}">${d[0]}</span></div><h3>${esc(h.title)}</h3><p>${esc(h.desc)}</p><div class="meta2" style="margin-block-start:6px"><span>التسليم ${fmtDay(h.due)}</span><span>${done} من ${studs.length} خلّصوا</span></div></div>
      <button class="del${sure?' sure':''}" type="button" data-act="del" data-kind="hw" data-id="${h.id}">${sure?'اضغط تاني للتأكيد':'حذف'}</button></article>`;
  }).join('')}</div>`:'<div class="card empty">لسه ما أضفتش واجبات.</div>';
  return hd('الواجبات','',`واجباتك في مادة ${esc(t.subject)} وعدد اللي خلّصوا كل واحد`)+form+list;
}

/* ---------- render + events ---------- */
function viewPage(){
  const p=ui.page,role=ui.user.role;
  if(p==='more')return pMore();
  const map=role==='parent'
    ?{home:pHome,grades:pGrades,attendance:pAtt,homework:pHw,schedule:pSched,news:pNews,msgs:pMsgs,notifs:pNotifs}
    :{home:tHome,grades:tGrades,attendance:tAtt,homework:tHw,news:pNews,msgs:pMsgs};
  return (map[p]||map.home)();
}
function render(){
  app.innerHTML=ui.user?viewShell(viewPage()):viewLogin()+viewFoot();
  if(ui.user){
    if(ui.page==='msgs')afterMsgs();
    if(ui.user.role==='teacher'&&ui.page==='grades')renderSheet();
  }else{
    const f=document.getElementById(ui.step==='code'?'code':'email');
    if(f&&(ui.step==='code'||ui.error))f.focus();
  }
}
function requestCode(email){
  ui.email=email;ui.code=String(Math.floor(100000+Math.random()*900000));ui.step='code';ui.error='';render();
}
function go(page){ui.page=page;ui.thread=ui.thread;ui.confirmDel=null;render();window.scrollTo(0,0)}

app.addEventListener('submit',e=>{
  e.preventDefault();
  const kind=e.target.getAttribute('data-form'),$=id=>document.getElementById(id);
  if(kind==='email'){
    const email=$('email').value.trim().toLowerCase();ui.email=email;
    if(!validEmail(email)){ui.error='اكتب الإيميل بشكل صحيح، مثلاً name@example.com';render();return}
    if(!roleOf(email)){ui.error='الإيميل ده مش مسجل في المدرسة. اتأكد من الكتابة أو كلّم إدارة المدرسة.';render();return}
    requestCode(email);
  }else if(kind==='code'){
    if($('code').value.trim()!==ui.code){ui.error='الكود غلط. اتأكد منه وجرّب تاني.';render();return}
    ui.user=roleOf(ui.email);ui.error='';ui.step='email';ui.child=null;ui.tExam=null;ui.page='home';ui.thread=null;
    setS(SKEY,ui.email);render();window.scrollTo(0,0);
  }else if(kind==='msg'){
    sendMsg();
  }else if(kind==='addstudent'){
    const name=$('ns-name').value.trim(),cls=$('ns-cls').value.trim(),pe=$('ns-email').value.trim().toLowerCase();
    if(!name||!cls){toast('اكتب اسم الطالب والفصل.');return}
    if(!validEmail(pe)){toast('اكتب إيميل ولي الأمر بشكل صحيح.');$('ns-email').focus();return}
    db.students.push({id:'s'+Date.now(),name,cls,parentEmail:pe});
    persist();ui.tClass=cls;render();
    toast('تمت إضافة '+name+'. ولي الأمر يقدر يدخل بإيميله من دلوقتي.');
  }else if(kind==='hw'){
    const title=$('hw-title').value.trim(),due=$('hw-due').value,cls=$('hw-cls').value;
    if(!title){toast('اكتب عنوان الواجب.');$('hw-title').focus();return}
    if(!due){toast('اختار ميعاد التسليم.');$('hw-due').focus();return}
    const t=ui.user.teacher;
    db.homework.push({id:'h'+Date.now(),cls,sub:t.subject,title,desc:$('hw-desc').value.trim(),due,by:t.name,posted:today()});
    persist();ui.tClass=cls;render();
    toast('تمت إضافة الواجب. أولياء أمور '+cls+' هيوصلهم إشعار (تجريبي).');
  }else if(kind==='news'){
    const title=$('nw-title').value.trim(),date=$('nw-date').value;
    if(!title){toast('اكتب عنوان الإعلان.');$('nw-title').focus();return}
    if(!date){toast('اختار التاريخ.');$('nw-date').focus();return}
    db.news.push({id:'n'+Date.now(),kind:$('nw-kind').value,title,body:$('nw-body').value.trim(),date,by:ui.user.teacher.name});
    persist();render();toast('اتنشر الإعلان وهيظهر لكل أولياء الأمور.');
  }
});

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.getAttribute('data-act');
  switch(act){
    case 'try':requestCode(b.getAttribute('data-email'));break;
    case 'back':ui.step='email';ui.error='';render();break;
    case 'logout':ui.user=null;ui.step='email';ui.email='';ui.error='';ui.page='home';ui.thread=null;setS(SKEY,null);render();window.scrollTo(0,0);break;
    case 'theme':{
      const v=isDark()?'light':'dark';applyTheme(v);setS(TKEY,v);refreshThemeBtns();break;
    }
    case 'nav':go(b.getAttribute('data-page'));break;
    case 'child':ui.child=b.getAttribute('data-id');render();break;
    case 'cls':ui.tClass=b.getAttribute('data-c');render();break;
    case 'month':ui.month+=parseInt(b.getAttribute('data-d'),10);render();break;
    case 'day':ui.day=parseInt(b.getAttribute('data-i'),10);render();break;
    case 'hwfilter':ui.hwFilter=b.getAttribute('data-f');render();break;
    case 'hwdone':{
      const k=b.getAttribute('data-id')+'|'+curKid().id;
      if(db.hwDone[k])delete db.hwDone[k];else db.hwDone[k]=true;
      persist();render();break;
    }
    case 'mailme':{
      const kid=curKid();
      toast('تم تجهيز درجات '+kid.name+' لإرسالها على '+ui.user.email+' (تجربة: مفيش إيميل بيتبعت فعلاً).');break;
    }
    case 'sendnow':toast('تم تجهيز إشعار النهارده وإرساله إلى '+ui.user.email+' (تجربة: مفيش إيميل بيتبعت فعلاً).');break;
    case 'talk':ui.thread=b.getAttribute('data-email');go('msgs');break;
    case 'save':saveGrades();break;
    case 'att':{
      ui.attDraft[b.getAttribute('data-sid')]=b.getAttribute('data-st');
      const studs=db.students.filter(s=>s.cls===ui.tClass);
      document.getElementById('attrows').innerHTML=attRows(studs);
      document.getElementById('attcount').textContent=attCount(studs);
      const again=document.querySelector('[data-act="att"][data-sid="'+b.getAttribute('data-sid')+'"][data-st="'+b.getAttribute('data-st')+'"]');
      if(again)again.focus();
      break;
    }
    case 'attall':{
      const studs=db.students.filter(s=>s.cls===ui.tClass);
      studs.forEach(s=>{ui.attDraft[s.id]='present'});
      document.getElementById('attrows').innerHTML=attRows(studs);
      document.getElementById('attcount').textContent=attCount(studs);
      break;
    }
    case 'attsave':saveAtt();break;
    case 'del':{
      const id=b.getAttribute('data-kind')+'|'+b.getAttribute('data-id');
      if(ui.confirmDel===id){
        if(b.getAttribute('data-kind')==='hw')db.homework=db.homework.filter(h=>h.id!==b.getAttribute('data-id'));
        else db.news=db.news.filter(n=>n.id!==b.getAttribute('data-id'));
        persist();ui.confirmDel=null;render();toast('تم الحذف.');
      }else{ui.confirmDel=id;render()}
      break;
    }
    case 'reset':
      db=seed();persist();ui.child=null;ui.tExam=null;ui.tClass=null;ui.tDate=null;ui.attKey='';ui.thread=null;render();toast('رجعت البيانات التجريبية.');break;
  }
});

app.addEventListener('change',e=>{
  if(!ui.user)return;
  const id=e.target.id;
  if(id==='daily'){setPrefs({daily:e.target.checked});return}
  if(id==='dtime'){setPrefs({time:e.target.value});return}
  if(id==='thr'){ui.thread=e.target.value;render();return}
  if(ui.user.role!=='teacher')return;
  if(ui.page==='grades'){
    if(id==='cls'){ui.tClass=e.target.value;renderSheet()}
    else if(id==='exam'){ui.tExam=e.target.value.trim();renderSheet()}
  }else if(ui.page==='attendance'){
    if(id==='cls'){ui.tClass=e.target.value;render()}
    else if(id==='tdate'){if(e.target.value){ui.tDate=e.target.value;render()}}
  }
});
app.addEventListener('input',e=>{
  if(e.target.closest&&e.target.closest('.srow')&&e.target.type==='number')refreshPills();
  else if(e.target.id==='max')refreshPills();
});

/* theme: saved choice, otherwise follow the device */
const savedTheme=getS(TKEY);
if(savedTheme)applyTheme(savedTheme);
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',refreshThemeBtns)}catch(err){}

/* resume a saved session in this browser */
const saved=getS(SKEY);
if(saved){const r=roleOf(saved);if(r)ui.user=r}
render();
})();
</script>

</body></html>
